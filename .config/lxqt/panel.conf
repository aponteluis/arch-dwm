[General]
__userfile__=true

[desktopswitch]
alignment=Left

[kbindicator]
alignment=Right
type=kbindicator
show_caps_lock=false
show_num_lock=false
show_scroll_lock=false
show_layout=true


[mount]
alignment=Right

[panel1]
desktop=0
iconSize=16
panelSize=22
plugins=customcommand, desktopswitch, taskbar, statusnotifier, tray, mount, volume, kbindicator, worldclock
position=Top

[taskbar]
buttonWidth=28
alignment=Left
buttonStyle=Icon
groupingEnabled=true
showGroupOnHover=false
iconByClass=true


[tray]
alignment=Right

[volume]
alignment=Right
device=1

[worldclock]
alignment=Right

[customcommand]
type=customcommand
alignment=Left
command=
runWithBash=false
repeat=false
text=
icon=/usr/share/icons/breeze-dark/actions/16/view-app-grid-symbolic.svg
tooltip=Apps
click=rofi -show drun
